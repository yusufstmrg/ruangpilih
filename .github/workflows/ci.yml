name: RuangPilih CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check app.js
      - run: node --check api/catalog.js
      - run: node --check api/recommend.js
      - run: node --check api/route.js
      - run: node --check api/admin.js
      - run: node --check admin/admin.js
      - name: Package full production source
        run: |
          mkdir -p dist
          zip -r dist/RuangPilih_Full_Production_Package_${GITHUB_SHA::7}.zip . -x '.git/*' 'node_modules/*' 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ruangpilih-full-production-package
          path: dist/RuangPilih_Full_Production_Package_*.zip
          retention-days: 30
