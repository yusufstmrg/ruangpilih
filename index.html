</style></head><body><div id="app"></div><script>
const CATEGORIES=[['home','Home','⌂'],['baby','Baby','◉'],['kitchen','Kitchen','▣'],['gadget','Gadget','▤'],['automotive','Automotive','◒'],['office','Office','▦'],['ai','AI Tools','✦'],['finance','Finance','◈'],['health','Health','♡'],['travel','Travel','✈'],['lifestyle','Lifestyle','◆'],['food','Food','♨'],['education','Education','▰'],['tools','Tools','⌁']];
const PICKS=[
{id:1,category:'gadget',tag:'SMART PICK',brand:'JBL Flip 6',name:'Speaker Bluetooth',rating:4.8,reviews:'1.2K',price:'Rp1.499.000',reason:'Portable, durable, and easy to use for everyday listening.',a:'#171c28',b:'#d9ab48',icon:'◉'},
{id:2,category:'home',tag:'BEST VALUE',brand:'Xiaomi 4 Lite',name:'Air Purifier',rating:4.7,reviews:'856',price:'Rp1.799.000',reason:'A practical fit for compact rooms and daily air circulation.',a:'#d8e2e8',b:'#7d8d98',icon:'◌'},
{id:3,category:'lifestyle',tag:'WORTH IT',brand:'Somethinc Niacinamide',name:'Skincare',rating:4.6,reviews:'2.1K',price:'Rp99.000',reason:'Accessible entry price for a simple, practical routine.',a:'#e8d5ce',b:'#efb1a1',icon:'✦'},
{id:4,category:'office',tag:'TOP PICK',brand:'ASUS Vivobook 14',name:'Laptop',rating:4.7,reviews:'643',price:'Rp6.499.000',reason:'Balanced for work, study, and everyday productivity.',a:'#1c2833',b:'#b9c7d4',icon:'▭'},
{id:5,category:'kitchen',tag:'POPULAR',brand:'Delonghi EC155',name:'Coffee Maker',rating:4.6,reviews:'512',price:'Rp2.599.000',reason:'Simple espresso workflow for a home setup.',a:'#443d36',b:'#d5b67b',icon:'◍'},
{id:6,category:'baby',tag:'FAMILY PICK',brand:'Joie Pact',name:'Baby Stroller',rating:4.8,reviews:'918',price:'Rp1.799.000',reason:'Compact fold and everyday practicality for young families.',a:'#a7b0b8',b:'#202830',icon:'⌁'}];
const GUIDES=[['Cara memilih air purifier tanpa salah beli','Buying Guide','7 min read'],['Laptop kerja: 5 hal yang paling penting dilihat','How to Choose','6 min read'],['Barang kecil yang ternyata kepake banget di rumah','Smart Finds','4 min read']];
let state={q:'',cat:'all',saved:JSON.parse(localStorage.getItem('rp_saved')||'[]'),compare:[],sort:'recommended',modal:null,ai:false,mobile:false};
const el=(s,r=document)=>r.querySelector(s), all=(s,r=document)=>[...r.querySelectorAll(s)];
function save(){localStorage.setItem('rp_saved',JSON.stringify(state.saved))}
function setState(p){state={...state,...p};render()}
function filtered(){let a=PICKS.filter(p=>(state.cat==='all'||p.category===state.cat)&&((p.brand+' '+p.name+' '+p.reason).toLowerCase().includes(state.q.toLowerCase())));if(state.sort==='rating')a.sort((x,y)=>y.rating-x.rating);return a}
function Header(){return `<header class="topbar"><div class="container nav"><a class="brand" href="#top"><img src="/assets/ruangpilih-logo.png" alt="RuangPilih"></a><button class="mobile" onclick="setState({mobile:!state.mobile})">☰</button><nav class="navlinks ${state.mobile?'open':''}"><a href="#categories">Kategori⌄</a><a href="#smart">Smart Picks</a><a href="#guides">Guides</a><a href="#compare">Perbandingan</a><button onclick="setState({ai:true})">✦ AI Assistant</button></nav><div class="navtools"><div class="search-mini">⌕<input value="${state.q.replaceAll('"','&quot;')}" oninput="state.q=this.value;render()" placeholder="Cari produk, kategori, kebutuhan..."></div><button class="savedcount" onclick="document.querySelector('#smart').scrollIntoView({behavior:'smooth'})">▱ ${state.saved.length}</button></div></div></header>`}
function Hero(){return `<section class="hero container" id="top"><div><div class="kicker">RESEARCH • COMPARE • RECOMMEND</div><h1>Helping You Choose<br><span>with Confidence</span></h1><p>RuangPilih membantu kamu menemukan produk, layanan, dan solusi yang layak dipertimbangkan — dengan riset, perbandingan, dan rekomendasi yang praktis.</p><div class="heroSearch">⌕<input value="${state.q.replaceAll('"','&quot;')}" oninput="state.q=this.value;render()" onkeydown="if(event.key==='Enter')document.querySelector('#smart').scrollIntoView({behavior:'smooth'})" placeholder="Cari produk, kategori, atau kebutuhan..."><button class="goldbtn" onclick="document.querySelector('#smart').scrollIntoView({behavior:'smooth'})">Cari</button></div><div class="trending"><span>Trending</span>${['Speaker Bluetooth','Air Purifier','Laptop','Coffee Maker'].map(t=>`<button onclick="state.q='${t}';render()">${t}</button>`).join('')}</div><div class="trustline"><div><b>Terpercaya</b><small>Riset & disclosure</small></div><div><b>Objektif</b><small>Pros & cons jelas</small></div><div><b>Praktis</b><small>Langsung ke poin</small></div><div><b>Berguna</b><small>Hemat waktu</small></div></div></div><div class="heroArt"><img src="/assets/ruangpilih-mark.png" alt="RuangPilih open doorway mark"><div class="heroNote"><small>THE ROOM BEFORE THE DECISION</small><b>Masuk saat masih bingung.<br>Keluar dengan pilihan lebih jelas.</b></div></div></section>`}
function Categories(){return `<section class="section container" id="categories"><div class="head"><div><div class="eyebrow">DISCOVER</div><h2>Kategori untuk setiap sisi kehidupan</h2><p>Dari kebutuhan rumah, bayi, gadget, hingga tools AI — satu ruang untuk berbagai pilihan.</p></div><a class="goldlink" href="#smart">Lihat semua →</a></div><div class="catrail"><button class="cat ${state.cat==='all'?'active':''}" onclick="state.cat='all';render()"><span class="icon">◉</span><b>Semua</b></button>${CATEGORIES.map(c=>`<button class="cat ${state.cat===c[0]?'active':''}" onclick="state.cat='${c[0]}';document.querySelector('#smart').scrollIntoView({behavior:'smooth'});render()"><span class="icon">${c[2]}</span><b>${c[1]}</b></button>`).join('')}</div></section>`}
function Picks(){let a=filtered();return `<section class="section container" id="smart"><div class="head"><div><div class="eyebrow">SMART PICKS</div><h2>Rekomendasi yang worth a look</h2><p>Dipilih berdasarkan use case, value, dan relevansi — bukan sekadar viral.</p></div><button class="ghost" onclick="state.sort=state.sort==='rating'?'recommended':'rating';render()">↕ ${state.sort==='rating'?'Highest Rated':'Recommended'}</button></div><div class="grid3">${a.map(p=>`<article class="pick"><div class="visual" style="--a:${p.a};--b:${p.b}"><span class="tag">${p.tag}</span><button class="bookmark ${state.saved.includes(p.id)?'saved':''}" onclick="toggleSave(${p.id})">▱</button><div class="product">${p.icon}</div></div><div class="pickBody"><div class="meta"><span>${p.category}</span><strong>★ ${p.rating} (${p.reviews})</strong></div><h3>${p.brand}</h3><p>${p.name} — ${p.reason}</p><div class="pickFoot"><b>${p.price}</b><div class="btns"><button class="ghost" onclick="toggleCompare(${p.id})">${state.compare.includes(p.id)?'✓ Added':'⇄ Compare'}</button><button class="detail" onclick="openPick(${p.id})">Detail →</button></div></div></div></article>`).join('')}</div>${a.length?`<div style="height:14px"></div>`:`<div class="empty"><div style="font-size:24px">⌕</div><b>Belum menemukan yang cocok</b><span>Coba kata kunci lain atau pilih kategori berbeda.</span></div>`}</section>`}
function Band(){return `<section class="section band"><div class="container bandGrid"><div><div class="eyebrow">WHY RUANGPILIH</div><h2>Kamu tidak butuh lebih banyak pilihan. Kamu butuh pilihan yang lebih jelas.</h2><p>RuangPilih mengambil lapisan keputusan di antara discovery dan transaksi: memahami kebutuhan, menyaring opsi, lalu menjelaskan trade-off dengan jujur.</p></div><div class="steps"><div class="step"><span class="num">01</span><b>Riset mendalam</b><span>Kami cari fakta, fitur, dan konteks penggunaan.</span></div><div class="step"><span class="num">02</span><b>Perbandingan jujur</b><span>Yang bagus sekaligus yang kurang tetap terlihat.</span></div><div class="step"><span class="num">03</span><b>Rekomendasi berbasis use case</b><span>Satu produk tidak cocok untuk semua orang.</span></div><div class="step"><span class="num">04</span><b>Disclosure transparan</b><span>Affiliate dan sponsorship dijelaskan jika ada.</span></div></div></div></section>`}
function Compare(){let c=PICKS.filter(p=>state.compare.includes(p.id));return `<section class="section container" id="compare"><div class="head"><div><div class="eyebrow">COMPARE</div><h2>Bandingkan sebelum memutuskan</h2><p>Pilih hingga 4 produk dari Smart Picks untuk melihat trade-off utama.</p></div></div>${c.length?`<div class="compareTable"><div class="compareHead"><span>Option</span>${c.map(p=>`<div><b>${p.brand}</b><button onclick="toggleCompare(${p.id})">✕</button></div>`).join('')}</div>${[['Rating',p=>`★ ${p.rating}`],['Price',p=>p.price],['Best for',p=>p.category==='gadget'?'Daily entertainment':p.category==='office'?'Work & study':'Everyday use'],['Key reason',p=>p.reason]].map(r=>`<div><span>${r[0]}</span>${c.map(p=>`<div>${r[1](p)}</div>`).join('')}</div>`).join('')}</div>`:`<div class="compareD">↔<div style="margin-top:8px"><b>Belum ada produk untuk dibandingkan</b><div>Klik “Compare” pada Smart Picks di atas.</div></div></div>`}</section>`}
function AI(){if(!state.ai)return '';return `<div class="modalBg" onclick="setState({ai:false})"><div class="aiModal" onclick="event.stopPropagation()"><button class="close" onclick="setState({ai:false})">✕</button><div class="eyebrow">RUANGPILIH AI</div><h2>Kasih tahu kebutuhanmu</h2><p style="color:#97a3b0">Contoh: “Laptop kerja di bawah Rp8 juta, ringan, cocok untuk meeting.”</p><textarea placeholder="Tulis kebutuhanmu di sini..."></textarea><div class="suggests"><button>Home gym budget kecil</button><button>Air purifier kamar 20m²</button><button>Laptop untuk kerja & AI</button></div><button class="goldbtn wide" onclick="alert('Demo AI: engine belum terhubung. Arsitektur siap untuk backend AI pada fase berikutnya.')">Generate shortlist ✦</button><small class="fine">Production note: hubungkan AI backend + structured product graph sebelum go-live AI.</small></div></div>`}
function Modal(){let p=state.modal;if(!p)return '';return `<div class="modalBg" onclick="setState({modal:null})"><div class="modal" onclick="event.stopPropagation()"><button class="close" onclick="setState({modal:null})">✕</button><div class="modalVisual" style="--a:${p.a||'#0b1f3a'};--b:${p.b||'#d4af37'}">${p.icon||'✦'}</div><div class="modalBody"><div class="eyebrow">${p.category||'GUIDE'}</div><h2>${p.brand||p.title}</h2><p><b>${p.name||p.type}</b></p><p>${p.reason||'Preview artikel akan tersedia pada CMS production.'}</p>${p.price?`<div class="modalPrice">${p.price}</div>`:''}<div class="modalActions"><button class="goldbtn" onclick="toggleSave(${p.id||0});setState({modal:null})">▱ Simpan</button><button class="secondary" onclick="setState({modal:null})">Tutup</button></div><small class="fine">Demo interface. Affiliate URLs dan merchant data belum terhubung pada MVP lokal.</small></div></div></div>`}
function Guides(){return `<section class="section container" id="guides"><div class="head"><div><div class="eyebrow">GUIDES</div><h2>Lebih paham, lebih yakin memilih</h2><p>Buying guides dan smart finds untuk membantu keputusan sehari-hari.</p></div><a class="goldlink" href="#guides">Semua artikel →</a></div><div class="guides">${GUIDES.map((g,i)=>`<article class="guide"><div class="guideVisual"><span>${g[1]}</span><span>${i===0?'◌':i===1?'▤':'✦'}</span></div><div class="guideBody"><h3>${g[0]}</h3><p>${g[2]} • RuangPilih Editorial</p><button onclick="setState({modal:{brand:'${g[0]}',name:'${g[1]}',reason:'Preview artikel akan tersedia pada CMS production.',price:'Read guide',category:'Guide',icon:'✦',a:'#111b29',b:'#d4af37'}})">Baca overview →</button></div></article>`).join('')}</div></section>`}
function Footer(){return `<section class="trustbar"><div class="container trustGrid"><div><b>Trust first</b><small>Revenue follows trust</small></div><div><b>Editorial independence</b><small>We never sell the verdict</small></div><div><b>Built to scale</b><small>Social → Search → Platform</small></div><div><b>AI-assisted</b><small>Human verified</small></div></div></section><footer class="footer"><div class="container footgrid"><div class="footbrand"><img src="/assets/ruangpilih-logo.png" alt="RuangPilih"><p>Helping You Choose with Confidence</p><small>Platform rekomendasi untuk berbagai kebutuhan hidup.</small></div><div class="footcol"><h4>Explore</h4><a href="#categories">Kategori</a><a href="#smart">Smart Picks</a><a href="#guides">Guides</a><a href="#compare">Perbandingan</a></div><div class="footcol"><h4>Trust</h4><a href="#top">How We Recommend</a><a href="#top">Editorial Policy</a><a href="#top">Affiliate Disclosure</a><a href="#top">Corrections</a></div><div class="footcol"><h4>Follow</h4><a href="#top">Instagram</a><a href="#top">TikTok</a><a href="#top">Threads</a><a href="#top">YouTube</a></div></div><div class="container footbottom"><span>© 2026 RuangPilih. All rights reserved.</span><span>Indonesia's Most Trusted Recommendation Platform</span></div></footer>`}
function App(){return `${Header()}<main>${Hero()}${Categories()}${Picks()}${Band()}${Compare()}<section class="section container"><div class="aiCard"><div class="aiIcon">✦</div><div><div class="eyebrow">COMING NEXT</div><h2>RuangPilih AI</h2><p>Masukkan kebutuhan, budget, dan preferensi. Dapatkan shortlist yang lebih personal saat engine AI resmi diluncurkan.</p></div><button class="goldbtn" onclick="setState({ai:true})">Preview AI →</button></div></section>${Guides()}</main>${Footer()}${state.compare.length?`<div class="compareDock"><span><b>${state.compare.length}</b> produk siap dibandingkan</span><button class="goldbtn" onclick="document.querySelector('#compare').scrollIntoView({behavior:'smooth'})">Lihat perbandingan →</button></div>`:''}${Modal()}${AI()}`}
function render(){document.getElementById('app').innerHTML=App()}
function toggleSave(id){if(!id)return;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render()}
function toggleCompare(id){state.compare=state.compare.includes(id)?state.compare.filter(x=>x!==id):state.compare.length<4?[...state.compare,id]:state.compare;render()}
function openPick(id){state.modal=PICKS.find(p=>p.id===id);render()}
render();
</script></body></html>
